name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} # Biasanya 22
          script: |
            # Sesuaikan lokasi folder project Anda di VPS
            cd /var/www/susan-spa/website
            
            # Ambil update terbaru dari branch main
            git pull origin main
            
            # Install dependencies terbaru
            npm install
            
            # Build project (Next.js)
            npm run build
            
            # Restart aplikasi menggunakan PM2
            # Ganti 'susan-spa' dengan nama aplikasi PM2 Anda
            pm2 restart susan-spa
