name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GITHUB_SHA,IMAGEKIT_PRIVATE_KEY,IMAGEKIT_URL_ENDPOINT
          command_timeout: 30m
          timeout: 60s
          script: |
            set -Eeuo pipefail

            REPO_URL="https://github.com/${{ github.repository }}.git"
            RELEASES_DIR="/opt/susanspa/releases"
            RELEASE_DIR="$RELEASES_DIR/$GITHUB_SHA"
            CURRENT_LINK="$RELEASES_DIR/current"

            PREVIOUS_TARGET="$(readlink -f /opt/susanspa/releases/current || true)"

            rollback() {
              echo "Deployment gagal. Menjalankan rollback."
              if [ -n "${PREVIOUS_TARGET:-}" ] && [ -d "$PREVIOUS_TARGET" ]; then
                ln -sfn "$PREVIOUS_TARGET" "$CURRENT_LINK"
                sudo systemctl restart susan-booking-api susan-cms susan-web || true
              fi
              rm -rf "$RELEASE_DIR"
              exit 1
            }

            trap rollback ERR

            echo "Memulai deploy untuk commit: $GITHUB_SHA"
            echo "Target release aktif sebelumnya: $PREVIOUS_TARGET"

            # Pastikan release directory bersih jika build sebelumnya gagal
            rm -rf "$RELEASE_DIR"
            git clone --no-checkout --depth 1 "$REPO_URL" "$RELEASE_DIR"
            cd "$RELEASE_DIR"
            git fetch --depth 1 origin "$GITHUB_SHA"
            git checkout --detach "$GITHUB_SHA"

            CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
            echo "Commit yang berhasil di-checkout: $CHECKED_OUT_COMMIT"
            test "$CHECKED_OUT_COMMIT" = "$GITHUB_SHA"

            echo "Menjalankan npm ci..."
            npm ci --ignore-scripts

            echo "Menjalankan build dengan batasan alokasi memori..."
            export NODE_OPTIONS="--max-old-space-size=1536 --no-deprecation"
            export NEXT_PRIVATE_BUILD_WORKER=0
            export NEXT_TELEMETRY_DISABLED=1
            npm run build

            echo "Memverifikasi artifact build..."
            test -f apps/web/.next/BUILD_ID
            test -f apps/cms/.next/BUILD_ID
            test -f apps/booking-api/dist/server.js

            echo "Menyinkronkan secret ImageKit ke environment CMS..."
            CMS_ENV_FILE="/etc/susanspa/cms.env"
            sync_cms_env() {
              name="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "Peringatan: secret $name kosong di GitHub, $CMS_ENV_FILE tidak diubah."
                return 0
              fi
              {
                sudo sed -i "/^${name}=/d" "$CMS_ENV_FILE" &&
                  printf '%s=%s\n' "$name" "$value" | sudo tee -a "$CMS_ENV_FILE" > /dev/null
              } || echo "Peringatan: gagal menulis $name ke $CMS_ENV_FILE. Isi manual di VPS, upload foto akan gagal tanpanya."
            }
            sync_cms_env IMAGEKIT_PRIVATE_KEY "${IMAGEKIT_PRIVATE_KEY:-}"
            sync_cms_env IMAGEKIT_URL_ENDPOINT "${IMAGEKIT_URL_ENDPOINT:-}"

            echo "Menjalankan migration dengan environment production..."
            set -a
            . /etc/susanspa/cms.env
            set +a
            npm run cms:migrate

            set -a
            . /etc/susanspa/booking.env
            set +a
            npm run db:migrate:booking

            echo "Memindahkan symlink secara atomic..."
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            echo "Restarting services..."
            sudo systemctl restart susan-booking-api susan-cms susan-web

            echo "Menjalankan health check dengan sistem retry (maksimal 45 detik)..."
            wait_for_service() {
              local url="$1"
              local name="$2"
              local max_attempts=15
              local attempt=1
              echo "Memeriksa kesiapan $name pada $url..."
              while [ $attempt -le $max_attempts ]; do
                if curl --fail --silent --show-error "$url" > /dev/null 2>&1; then
                  echo "-> $name siap pada percobaan ke-$attempt"
                  return 0
                fi
                sleep 3
                attempt=$((attempt + 1))
              done
              echo "-> Error: $name tidak merespons setelah $max_attempts percobaan"
              return 1
            }

            wait_for_service "http://127.0.0.1:4000/health" "susan-booking-api"
            wait_for_service "http://127.0.0.1:3000/" "susan-web"
            wait_for_service "http://127.0.0.1:3001/cms" "susan-cms"
            sudo nginx -t

            echo "Memverifikasi status service..."
            systemctl is-active susan-web susan-cms susan-booking-api nginx

            trap - ERR

            echo "Deployment berhasil diselesaikan!"
            echo "Website: https://reservasiku.my.id"
            echo "CMS: https://susancms.reservasiku.my.id/cms"

            echo "Membersihkan rilis lama..."
            cd "$RELEASES_DIR"
            ls -1 | grep -v '^current$' | grep -v '^backup' | sort -r | tail -n +6 | while read old_release; do
              OLD_RELEASE_PATH="$RELEASES_DIR/$old_release"
              if [ "$OLD_RELEASE_PATH" != "$PREVIOUS_TARGET" ] && [ "$OLD_RELEASE_PATH" != "$RELEASE_DIR" ] && [ "$OLD_RELEASE_PATH" != "$(readlink -f $CURRENT_LINK || true)" ]; then
                echo "Menghapus rilis lama: $old_release"
                rm -rf "$OLD_RELEASE_PATH"
              fi
            done
