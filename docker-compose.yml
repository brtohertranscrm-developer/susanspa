services:
  cms-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: susan_cms
      POSTGRES_USER: susan_cms
      POSTGRES_PASSWORD: susan_cms_local
    ports:
      - "5433:5432"
    volumes:
      - susan_cms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susan_cms -d susan_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: susan_booking
      POSTGRES_USER: susan_booking
      POSTGRES_PASSWORD: susan_booking_local
    ports:
      - "5434:5432"
    volumes:
      - susan_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susan_booking -d susan_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  susan_cms_data:
  susan_booking_data:
